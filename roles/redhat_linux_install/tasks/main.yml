---
- name: Create new lpar
  run_once: true
  connection: local
  collections:
      - ibm.power_hmc
  powervm_lpar_instance:
      hmc_host: "{{ hostvars['hmc_server'].ansible_host }}"
      hmc_auth: '{{ redhat_linux_install_curr_hmc_auth }}'
      system_name: "{{ redhat_linux_install_managed_system }}"
      vm_name: "{{ redhat_linux_install_lpar_name }}"
      os_type: linux
      proc: "{{ redhat_linux_install_proc }}"
      mem: "{{ redhat_linux_install_mem }}"
      virt_network_config:
          - network_name: "{{ redhat_linux_install_network_name }}"
      volume_config:
          - volume_size: "{{ redhat_linux_install_disk_size }}"
      state: present
  delegate_to: "{{ groups['hmcs'][0] }}"

- name: Facts of the partition
  run_once: true
  connection: local
  collections:
      - ibm.power_hmc
  powervm_lpar_instance:
      hmc_host: "{{ hostvars['hmc_server'].ansible_host }}"
      hmc_auth: '{{ redhat_linux_install_curr_hmc_auth }}'
      system_name: "{{ redhat_linux_install_managed_system }}"
      vm_name: "{{ redhat_linux_install_lpar_name }}"
      advanced_info: true
      state: facts
  register: redhat_linux_install_facts_output

- name: Find MAC address for specific network
  ansible.builtin.set_fact:
      redhat_linux_install_mac_address: "{{ item.mac_address }}"
  when: item.virtual_network_name == redhat_linux_install_network_name
  loop: "{{ redhat_linux_install_facts_output.partition_info.VirtualNetworkAdapters }}"

- name: Fail if MAC address is empty
  ansible.builtin.fail:
      msg: "MAC address not found for network: {{ redhat_linux_install_network_name }}"
  when: redhat_linux_install_mac_address is not defined or redhat_linux_install_mac_address | length == 0

- name: Convert MAC address in colon format from fact variable
  ansible.builtin.set_fact:
      redhat_linux_install_hardware_ethernet: "{{ redhat_linux_install_mac_address | regex_replace('(..)(..)(..)(..)(..)(..)', '\\1:\\2:\\3:\\4:\\5:\\6') }}"

- name: Convert MAC address from in hyphen format from fact variable
  ansible.builtin.set_fact:
      redhat_linux_install_address: "{{ redhat_linux_install_mac_address | regex_replace('(..)(..)(..)(..)(..)(..)', '\\1-\\2-\\3-\\4-\\5-\\6') }}"

- name: Gather service facts
  run_once: true
  ansible.builtin.service_facts:
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Check if the pxe server has dhcp and tftp services running
  run_once: true
  ansible.builtin.set_fact:
      redhat_linux_install_dhcpd_running: "{{ 'dhcpd.service' in services and services['dhcpd.service'].state == 'running' }}"
      redhat_linux_install_tftp_running: >-
        {{ ('tftp.service' in services and services['tftp.service'].state == 'running') or
          ('xinetd.service' in services and services['xinetd.service'].state == 'running') }}
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Install dhcp in pxe server
  when: not redhat_linux_install_dhcpd_running
  block:
      - name: Install dhcp in pxe server
        ansible.builtin.dnf:
            name:
                - dhcp-server
            state: present
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Calculate DHCP range from IP (assuming /24 subnet) using bash only
        ansible.builtin.shell: |
            set -o pipefail
            ip="{{ redhat_linux_install_host_subnet }}"
            # Assume /24 subnet
            cidr=24
            netmask="255.255.255.0"

            # Extract network base IP
            IFS=. read -r o1 o2 o3 o4 <<< "$ip"
            network="${o1}.${o2}.${o3}.0"

            ip_to_dec() {
            IFS=. read -r a b c d <<< "$1"
            echo $(( (a << 24) + (b << 16) + (c << 8) + d ))
            }

            dec_to_ip() {
            a=$(( ($1 >> 24) & 255 ))
            b=$(( ($1 >> 16) & 255 ))
            c=$(( ($1 >> 8) & 255 ))
            d=$(( $1 & 255 ))
            echo "$a.$b.$c.$d"
            }

            net_dec=$(ip_to_dec "$network")
            mask_dec=$(ip_to_dec "$netmask")
            broadcast_dec=$(( net_dec | (~mask_dec & 0xFFFFFFFF) ))

            start_dec=$(( net_dec + 10 ))
            end_dec=$(( broadcast_dec - 1 - 1 ))  # second-to-last usable

            start_ip=$(dec_to_ip "$start_dec")
            end_ip=$(dec_to_ip "$end_dec")

            echo "dhcp_range_start=$start_ip"
            echo "dhcp_range_end=$end_ip"
        register: redhat_linux_install_dhcp_range_output
        changed_when: false
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Set DHCP range facts
        ansible.builtin.set_fact:
            redhat_linux_install_dhcp_range_start: >-
              {{ redhat_linux_install_dhcp_range_output.stdout_lines
                | select('search', '^dhcp_range_start=')
                | first
                | regex_replace('^dhcp_range_start=', '') }}

            redhat_linux_install_dhcp_range_end: >-
              {{ redhat_linux_install_dhcp_range_output.stdout_lines
                | select('search', '^dhcp_range_end=')
                | first
                | regex_replace('^dhcp_range_end=', '') }}
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Add block for dhcp configuration
        run_once: true
        ansible.builtin.template:
            src: templates/dhcp_server_conf.j2
            dest: "/etc/dhcp/dhcpd.conf"
            owner: root
            group: root
            mode: '0644'
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Enable and start dhcp-server
        ansible.builtin.systemd:
            name: dhcpd
            state: started
            enabled: true
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Open DHCP ports in firewall
        ansible.posix.firewalld:
            service: dhcp
            permanent: true
            state: enabled
            immediate: true
        delegate_to: "{{ groups['pxe'][0] }}"

- name: Install tftp in pxe server
  when: not redhat_linux_install_tftp_running
  block:
      - name: Install tftp in pxe server
        ansible.builtin.dnf:
            name: tftp-server
            state: present
            use_backend: dnf4
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Ensure TFTP root directory exists
        ansible.builtin.file:
            path: /var/lib/tftpboot
            state: directory
            owner: root
            group: root
            mode: '0755'
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Enable and start tftp-socket
        ansible.builtin.systemd:
            name: tftp.socket
            state: started
            enabled: true
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Enable and start tftp-server
        ansible.builtin.systemd:
            name: tftp.service
            state: started
            enabled: true
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Install grub2-tools-extra and wget package in pxe server
        ansible.builtin.dnf:
            name: grub2-tools-extra
            state: present
            use_backend: dnf4
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Install wget package in pxe server
        ansible.builtin.dnf:
            name: wget
            state: present
            use_backend: dnf4
        delegate_to: "{{ groups['pxe'][0] }}"

      - name: Open TFTP ports in firewall
        ansible.posix.firewalld:
            service: tftp
            permanent: true
            state: enabled
            immediate: true
        delegate_to: "{{ groups['pxe'][0] }}"

- name: Create Kickstart file name
  ansible.builtin.set_fact:
      redhat_linux_install_ks_file: "{{ redhat_linux_install_distro | regex_replace('\\.', '') }}_{{ redhat_linux_install_hardware_ethernet }}.ks"

- name: Create a kickstart file in Repository server
  run_once: true
  ansible.builtin.template:
      src: templates/ks.j2
      dest: "/var/www/html/{{ redhat_linux_install_ks_file }}"
      mode: '0777'
  delegate_to: "{{ groups['repo'][0] }}"

- name: Remove any existing tftp boot folder in PXE server for this VM
  run_once: true
  ansible.builtin.file:
      path: "{{ redhat_linux_install_dest_dir }}"
      state: absent
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Calculate cutdir value
  ansible.builtin.shell: set -o pipefail && echo "{{ redhat_linux_install_repo_dir }}" | tr '/' '\n' | grep -v "^$" | wc -l
  register: redhat_linux_install_cut_dir
  changed_when: false
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Download files from /boot and /ppc directory in Repository Server to the PXE server tftp path(hardware address)
  run_once: true
  ansible.builtin.shell: >-
    wget -r -nv --show-progress --reject="index.html*" --no-parent -nH
    --cut-dirs={{ redhat_linux_install_cut_dir.stdout | int + 1 }}
    http://{{ hostvars[groups['repo'][0]].ansible_host }}:{{ redhat_linux_install_repo_port }}/{{ redhat_linux_install_repo_dir }}/boot/
    -P {{ redhat_linux_install_dest_dir }}

  changed_when: false
  delegate_to: "{{ groups['pxe'][0] }}"
  # noqa: command-instead-of-module wget

- name: Download files from /boot and /ppc directory in Repository Server to the PXE server tftp path(hardware address)
  run_once: true
  ansible.builtin.shell: >-
    wget -r -nv --show-progress --reject="index.html*" --no-parent -nH
    --cut-dirs={{ redhat_linux_install_cut_dir.stdout | int + 1 }}
    http://{{ hostvars[groups['repo'][0]].ansible_host }}:{{ redhat_linux_install_repo_port }}/{{ redhat_linux_install_repo_dir }}/ppc/
    -P {{ redhat_linux_install_dest_dir }}

  changed_when: false
  delegate_to: "{{ groups['pxe'][0] }}"
  # noqa: command-instead-of-module wget

- name: Create netboot directory in PXE server under tftp path
  run_once: true
  ansible.builtin.command: >
    grub2-mknetdir
    --net-directory={{ redhat_linux_install_base_dir }}
    --subdir={{ redhat_linux_install_mac_address }}/boot/grub/
  changed_when: false
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Create grub.cfg and copy to boot directory in PXE server
  run_once: true
  ansible.builtin.template:
      src: templates/grub_conf.j2
      dest: "{{ redhat_linux_install_dest_dir }}/boot/grub/grub.cfg"
      mode: "0777"
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Copy grub.cfg to PXE server boot directory
  run_once: true
  ansible.builtin.command: >
    cp "{{ redhat_linux_install_dest_dir }}/boot/grub/grub.cfg"
       "{{ redhat_linux_install_dest_dir }}/boot/grub/powerpc-ieee1275/grub.cfg-01-{{ redhat_linux_install_address }}"
  changed_when: false
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Backup the dhcp file , if in case this blocks add any errors
  run_once: true
  ansible.builtin.command: cp /etc/dhcp/dhcpd.conf /tmp/dhcpd.conf
  changed_when: false
  delegate_to: "{{ groups['pxe'][0] }}"

- name: DHCP block file to add lpar entry into dhcpd.conf
  run_once: true
  ansible.builtin.blockinfile:
      dest: /etc/dhcp/dhcpd.conf
      marker: "#{mark} Ansible module dhcp entry"
      block: "{{ lookup('template', 'dhcpd_conf.j2') }}"
      state: present
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Restart dhcp-server
  run_once: true
  ansible.builtin.systemd:
      name: dhcpd
      state: restarted
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Lparnetboot operation on target lpar # noqa: ignore-errors
  run_once: true
  connection: local
  collections:
      - ibm.power_hmc
  powervm_lpar_instance:
      hmc_host: "{{ hostvars['hmc_server'].ansible_host }}"
      hmc_auth: "{{ redhat_linux_install_curr_hmc_auth }}"
      system_name: "{{ redhat_linux_install_managed_system }}"
      vm_name: "{{ redhat_linux_install_lpar_name }}"
      install_settings:
          vm_ip: "{{ redhat_linux_install_host_ip }}"
          nim_ip: "{{ hostvars['pxe_server'].ansible_host }}"
          nim_gateway: "{{ redhat_linux_install_host_gw }}"
          nim_subnetmask: "{{ redhat_linux_install_host_netmask }}"
          vm_mac: "{{ redhat_linux_install_mac_address }}"
          timeout: 11
      action: install_os
  ignore_errors: true
  delegate_to: "{{ groups['hmcs'][0] }}"

- name: Revert the DHCP configuration changes in PXE server, take a backup of configuration file
  run_once: true
  ansible.builtin.command: cp /etc/dhcp/dhcpd.conf /tmp/dhcpd.conf
  changed_when: false
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Block file
  run_once: true
  ansible.builtin.blockinfile:
      dest: /etc/dhcp/dhcpd.conf
      marker: "#{mark} Ansible module dhcp entry"
      block: "{{ lookup('template', 'dhcpd_conf.j2') }}"
      state: absent
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Restart dhcp-server
  run_once: true
  ansible.builtin.systemd:
      name: dhcpd
      state: restarted
  delegate_to: "{{ groups['pxe'][0] }}"

- name: Wait for host SSH to become available after install
  run_once: true
  ansible.builtin.wait_for_connection:
      timeout: 10
      sleep: 5
  vars:
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      ansible_host: "{{ redhat_linux_install_host_ip }}"

- name: Ensure system facts are gathered from the VM
  run_once: true
  ansible.builtin.setup:
  vars:
      ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
  delegate_to: "{{ groups['vm'][0] }}"

- name: Print OS info from the VM
  run_once: true
  ansible.builtin.debug:
      msg: "Distribution: {{ ansible_facts['distribution'] }}, Version: {{ ansible_facts['distribution_version'] }}"
  delegate_to: "{{ groups['vm'][0] }}"
