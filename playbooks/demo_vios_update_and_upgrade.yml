- name: Demonstration of upgrading the VIOS version to 4.1.0.10 and then updating the minor patch version 4.1.0.21
  hosts: hmcs
  connection: local
  vars:
      curr_hmc_auth:
          username: hscroot
          password: <password>

  tasks:
      - name: Get the current version of VIOS
        ibm.power_hmc.vios_update_upgrade:
            hmc_host: '{{ inventory_hostname }}'
            hmc_auth: '{{ curr_hmc_auth }}'
            attributes:
                vios_name: <vios-name>
                system_name: <system-name>
            state: facts

      - name: Upgrade the VIOS version from 3.1.0.21 to 4.1.0.10 using a VIOS update image from NFS
        ibm.power_hmc.vios_update_upgrade:
            hmc_host: '{{ inventory_hostname }}'
            hmc_auth: '{{ curr_hmc_auth }}'
            attributes:
                repository: nfs
                system_name: <system-name>
                vios_name: <vios-name>
                host_name: <nfs server>
                mount_loc: /extras/viosimages
                options: 4
                files:
                    - <upgrade-image-file>
                disks:
                    - hdisk5
            state: upgraded

      - name: Update the VIOS version to 4.1.0.21 using a VIOS update image from NFS
        ibm.power_hmc.vios_update_upgrade:
            hmc_host: '{{ inventory_hostname }}'
            hmc_auth: '{{ curr_hmc_auth }}'
            attributes:
                repository: nfs
                system_name: <system-name>
                vios_name: <vios-name>
                host_name: <nfs server>
                mount_loc: /extras/viosimages
                directory: vios/update/VIOS_FP_3.1.3.14
                files:
                    - <update-image-file>
            state: updated

      - name: List the available filesets on the VIOS installation media
        ibm.power_hmc.vios_update_upgrade:
            hmc_host: '{{ inventory_hostname }}'
            hmc_auth: '{{ curr_hmc_auth }}'
            attributes:
                vios_name: <vios-name>
                system_name: <system-name>
                device: /dev/cd0
            action: list

      - name: Remove the specified filesets from the VIOS
        ibm.power_hmc.vios_update_upgrade:
            hmc_host: '{{ inventory_hostname }}'
            hmc_auth: '{{ curr_hmc_auth }}'
            attributes:
                vios_name: <vios-name>
                system_name: <system-name>
                filesets:
                    - <fileset-name>
            action: remove

      - name: Cleanup partially installed updates on the VIOS
        ibm.power_hmc.vios_update_upgrade:
            hmc_host: '{{ inventory_hostname }}'
            hmc_auth: '{{ curr_hmc_auth }}'
            attributes:
                vios_name: <vios-name>
                system_name: <system-name>
            action: cleanup

      - name: Remove outdated filesets from the VIOS
        ibm.power_hmc.vios_update_upgrade:
            hmc_host: '{{ inventory_hostname }}'
            hmc_auth: '{{ curr_hmc_auth }}'
            attributes:
                vios_name: <vios-name>
                system_name: <system-name>
            action: remove_outdated_filesets
