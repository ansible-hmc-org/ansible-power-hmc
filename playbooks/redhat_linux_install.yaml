---
- name: Install linux
  hosts: localhost
  collections:
    - ibm.power_hmc
  gather_facts: false
  roles:
    - role: redhat_linux_install
      vars:
        distro: redhat9.1
        repo_dir: /crtl/
        host_ip: 1.2.3.4
        host_gw: 1.2.3.1
        host_subnet: 1.2.3.0
        host_netmask: 255.255.255.0
        dns_ip: 1.6.6.6
        hostname: zip1.pus.sub.com
        lpar_name: vm-zip1
        hardware_ethernet: 11:11:11:11:11:11
        managed_system: zip1
        host_password: "{{ hostvars[groups['vm'][0]].ansible_password }}" 

